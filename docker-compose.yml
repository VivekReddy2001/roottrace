services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/roottrace-dev   # local development only
      NEO4J_server_memory_heap_max__size: 512m
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p roottrace-dev 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  demo:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: roottrace-dev
    command: ["python", "-m", "roottrace", "demo", "--neo4j"]
