[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roottrace"
version = "0.1.0"
description = "Graph-based root-cause analysis for microservice incidents, with a reproducible top-k benchmark and a Neo4j backend."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vivek Reddy Pitta" }]
requires-python = ">=3.10"
dependencies = ["networkx>=3.2", "numpy>=1.26", "scipy>=1.11", "neo4j>=5.14", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = ["roottrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
